services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: video_2_link_db
      POSTGRES_USER: myapp
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "80:80"
    environment:
      RAILS_ENV: production
      RAILS_LOG_LEVEL: info
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      DATABASE_URL: postgres://myapp:${DATABASE_PASSWORD}@db:5432/video_2_link_db
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    command: ["./bin/rails", "server", "-b", "0.0.0.0", "-p", "80"]
  bot:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      RAILS_ENV: production
      RAILS_LOG_LEVEL: info
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      DATABASE_URL: postgres://myapp:${DATABASE_PASSWORD}@db:5432/video_2_link_db
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    command: ["./bin/rails", "bot:start"]

volumes:
  postgres_data:
